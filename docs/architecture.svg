<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760"
     role="img" aria-label="Peptide Suite architecture: a policy artifact feeds every coefficient to an engine that holds none; the engine's scan feeds the landscape grid and the transformation vector; five gates refuse rather than estimate; a separate ML layer carries its own provenance; FastAPI serves the browser.">
  <title>Peptide Suite architecture</title>
  <style>
    :root {
      --surface: #fcfcfb; --page: #f9f9f7; --raised: #ffffff;
      --ink: #0b0b0b; --ink2: #52514e; --ink3: #898781;
      --edge: #c3c2b7; --hair: #e1e0d9;
      --accent: #2a78d6; --refuse: #d03b3b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #1a1a19; --page: #0d0d0d; --raised: #222221;
        --ink: #ffffff; --ink2: #c3c2b7; --ink3: #898781;
        --edge: #383835; --hair: #2c2c2a;
        --accent: #3987e5; --refuse: #d55859;
      }
    }
    .bg { fill: var(--page); }
    .box { fill: var(--raised); stroke: var(--edge); stroke-width: 1; rx: 6; }
    .band { fill: var(--surface); stroke: var(--hair); stroke-width: 1; rx: 8; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .h { fill: var(--ink); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
    .t { fill: var(--ink); font-size: 12.5px; font-weight: 600; }
    .s { fill: var(--ink2); font-size: 11.5px; }
    .m { fill: var(--ink3); font-size: 10.5px; }
    .edge { stroke: var(--edge); stroke-width: 1.5; fill: none; }
    .edge-accent { stroke: var(--accent); stroke-width: 1.5; fill: none; }
    .edge-refuse { stroke: var(--refuse); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
    .lab { fill: var(--ink2); font-size: 10.5px; }
    .lab-refuse { fill: var(--refuse); font-size: 10.5px; font-weight: 600; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--edge)"/>
    </marker>
    <marker id="aa" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--accent)"/>
    </marker>
    <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="var(--refuse)"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="760"/>

  <!-- Input -->
  <rect class="box" x="360" y="20" width="260" height="46"/>
  <text class="t" x="490" y="41" text-anchor="middle">Sequence or name</text>
  <text class="m" x="490" y="57" text-anchor="middle">parsed, then identified — the name keys every later lookup</text>
  <path class="edge" d="M490 66 L490 100" marker-end="url(#a)"/>

  <!-- Policy artifact -->
  <rect class="box" x="20" y="96" width="228" height="128"/>
  <text class="h" x="34" y="119">POLICY ARTIFACT</text>
  <text class="s" x="34" y="139">Every weight, threshold, cutoff.</text>
  <text class="s" x="34" y="156">Loaded before the app exists;</text>
  <text class="s" x="34" y="173">absent, the server refuses to</text>
  <text class="s" x="34" y="190">start rather than falling back.</text>
  <text class="m" x="34" y="211">Aggregate terms carry opaque identifiers</text>
  <path class="edge-accent" d="M248 168 L300 168" marker-end="url(#aa)"/>
  <text class="lab" x="274" y="158" text-anchor="middle">feeds</text>

  <!-- Engine -->
  <rect class="band" x="300" y="100" width="440" height="252"/>
  <text class="h" x="318" y="124">ENGINE — holds no coefficients</text>

  <rect class="box" x="318" y="138" width="196" height="44"/>
  <text class="t" x="330" y="158">Function inference</text>
  <text class="m" x="330" y="173">identity before goal</text>

  <rect class="box" x="526" y="138" width="196" height="44"/>
  <text class="t" x="538" y="158">Conservation</text>
  <text class="m" x="538" y="173">gated on homolog count</text>

  <rect class="box" x="318" y="192" width="196" height="44"/>
  <text class="t" x="330" y="212">Electrostatics</text>
  <text class="m" x="330" y="227">per-residue pKa, multi-pH</text>

  <rect class="box" x="526" y="192" width="196" height="44"/>
  <text class="t" x="538" y="212">Substitution scan</text>
  <text class="m" x="538" y="227">length × 19, each with its terms</text>

  <rect class="box" x="318" y="246" width="404" height="56"/>
  <text class="t" x="330" y="266">Explanatory depth — contracts built, engines absent</text>
  <text class="m" x="330" y="281">conformer ensembles · n→π* backbone · SAPT decomposition</text>
  <text class="m" x="330" y="294">each raises rather than estimating</text>

  <rect class="box" x="318" y="310" width="404" height="30"/>
  <text class="s" x="330" y="329">Evidence tier, magnitude and confidence stay separate axes.</text>

  <!-- Gates -->
  <rect class="band" x="762" y="100" width="198" height="252"/>
  <text class="h" x="778" y="124">GATES</text>
  <text class="m" x="778" y="140">refuse rather than estimate</text>
  <text class="s" x="778" y="166">Structure template</text>
  <text class="m" x="778" y="180">last tier is refusal</text>
  <text class="s" x="778" y="204">Residue registry</text>
  <text class="m" x="778" y="218">empty — research request</text>
  <text class="s" x="778" y="242">Contact classifier</text>
  <text class="m" x="778" y="256">essential footprint frozen</text>
  <text class="s" x="778" y="280">Class B1 placement</text>
  <text class="m" x="778" y="294">affinity alone is not a win</text>
  <text class="s" x="778" y="318">Synthetic feasibility</text>
  <text class="m" x="778" y="332">regioselectivity, aspartimide</text>
  <path class="edge-refuse" d="M740 226 L762 226" marker-end="url(#ar)"/>

  <path class="edge" d="M490 352 L490 386" marker-end="url(#a)"/>

  <!-- Outputs -->
  <rect class="box" x="300" y="386" width="212" height="72"/>
  <text class="t" x="312" y="408">Substitution landscape</text>
  <text class="s" x="312" y="425">position × residue, unranked</text>
  <text class="m" x="312" y="441">uncomputed cells hatched, never zeroed;</text>
  <text class="m" x="312" y="453">column marginal on a zero baseline</text>

  <rect class="box" x="528" y="386" width="212" height="72"/>
  <text class="t" x="540" y="408">Transformations</text>
  <text class="s" x="540" y="425">discrete moves, eight objectives</text>
  <text class="m" x="540" y="441">never collapsed to one number,</text>
  <text class="m" x="540" y="453">never an "optimised sequence"</text>

  <!-- ML layer -->
  <rect class="band" x="20" y="496" width="940" height="152"/>
  <text class="h" x="38" y="520">ML LAYER — its own provenance categories, never merged with the above</text>

  <rect class="box" x="38" y="534" width="216" height="94"/>
  <text class="t" x="50" y="554">Encoders</text>
  <text class="s" x="50" y="571">composition · positional one-hot</text>
  <text class="m" x="50" y="588">both deterministic: no learned content,</text>
  <text class="m" x="50" y="600">and never reported as though they had</text>
  <text class="m" x="50" y="617">ESM-2 raises — no silent fallback</text>

  <rect class="box" x="268" y="534" width="216" height="94"/>
  <text class="t" x="280" y="554">Evaluation</text>
  <text class="s" x="280" y="571">random vs clustered splits</text>
  <text class="m" x="280" y="588">union-find single-linkage, so no pair</text>
  <text class="m" x="280" y="600">across the split is near-duplicate</text>
  <text class="m" x="280" y="617">bootstrap intervals on every metric</text>

  <rect class="box" x="498" y="534" width="216" height="94"/>
  <text class="t" x="510" y="554">Representation explorer</text>
  <text class="s" x="510" y="571">PCA, leading with explained variance</text>
  <text class="m" x="510" y="588">refuses to mix two encoder spaces;</text>
  <text class="m" x="510" y="600">sign fixed so the plot does not mirror</text>
  <text class="m" x="510" y="617">itself between runs on the same data</text>

  <rect class="box" x="728" y="534" width="216" height="94"/>
  <text class="t" x="740" y="554">Dataset registry</text>
  <text class="s" x="740" y="571">8 tasks, 7 unavailable here</text>
  <text class="m" x="740" y="588">each names its source and licence;</text>
  <text class="m" x="740" y="600">no task is backed by invented labels</text>
  <text class="m" x="740" y="617">model cards refuse to omit limits</text>

  <path class="edge" d="M406 458 L406 496" marker-end="url(#a)"/>
  <path class="edge" d="M634 458 L634 496" marker-end="url(#a)"/>

  <!-- API -->
  <rect class="box" x="300" y="680" width="380" height="56"/>
  <text class="t" x="490" y="703" text-anchor="middle">FastAPI  →  browser</text>
  <text class="m" x="490" y="722" text-anchor="middle">nothing is computed in the page, so the display cannot drift from the engine</text>
  <path class="edge" d="M490 648 L490 680" marker-end="url(#a)"/>
</svg>
